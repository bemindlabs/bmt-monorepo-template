name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us understand and reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component or service is affected?
      options:
        - 'API Gateway'
        - 'Web Portal'
        - 'Web Admin'
        - 'Web POS'
        - 'Web Franchise'
        - 'Web CRM'
        - 'Web HR'
        - 'Web Project'
        - 'Web Support'
        - 'Web Tools'
        - 'Web Analytics'
        - 'Web Loyalty'
        - 'Web Website Builder'
        - 'Web Landing'
        - 'Web Omni Portal'
        - 'Mobile App'
        - 'Desktop POS'
        - 'service-core'
        - 'service-inventory'
        - 'service-accounting'
        - 'service-ai'
        - 'service-hr'
        - 'service-crm'
        - 'service-payment'
        - 'service-notification'
        - 'service-logistics'
        - 'service-procurement'
        - 'service-production'
        - 'service-bi'
        - 'service-marketing'
        - 'service-integration'
        - 'service-documents'
        - 'service-project'
        - 'service-website'
        - 'service-loyalty'
        - 'service-workflow'
        - 'Shared Package'
        - 'Infrastructure'
        - 'Documentation'
        - 'Other'
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - 'Critical - System is unusable or data loss'
        - 'High - Major functionality broken'
        - 'Medium - Feature partially broken'
        - 'Low - Minor inconvenience'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., macOS 14.0, Ubuntu 22.04]
        - Node.js version: [e.g., 20.10.0]
        - pnpm version: [e.g., 8.15.0]
        - Browser (if applicable): [e.g., Chrome 120, Safari 17]
        - App version: [e.g., 1.0.0-beta]
      value: |
        - OS:
        - Node.js version:
        - pnpm version:
        - Browser (if applicable):
        - App version:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: Paste any relevant error messages or log output
      placeholder: |
        Paste error messages or logs here...
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem
      placeholder: Drag and drop images here or paste image URLs...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context about the problem here...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have read the [CONTRIBUTING.md](https://github.com/your-org/monorepo-agents-workflow/blob/main/CONTRIBUTING.md)
          required: true
        - label: I am willing to submit a PR to fix this bug (optional)
          required: false
