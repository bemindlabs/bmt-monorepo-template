services:
  # Web application
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    ports:
      - '3000:3000'
      - '5173:5173'
    volumes:
      - ../..:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - DOCKER=true
    env_file:
      - ../../.env
    networks:
      - monorepo-network
    depends_on:
      - redis

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - monorepo-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database (optional)
  postgres:
    image: postgres:16-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monorepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-monorepo_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monorepo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-monorepo}']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  monorepo-network:
    driver: bridge

volumes:
  node_modules:
  redis-data:
  postgres-data:
