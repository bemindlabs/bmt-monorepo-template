apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: monorepo
  labels:
    app.kubernetes.io/name: monorepo
type: Opaque
stringData:
  # Replace with actual secrets or use external secrets management
  DATABASE_URL: 'postgresql://user:password@postgres:5432/monorepo'
  REDIS_URL: 'redis://redis:6379'
  # API keys should be managed via external secrets manager in production
  # ANTHROPIC_API_KEY: ''
  # OPENAI_API_KEY: ''
