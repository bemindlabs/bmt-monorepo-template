apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monorepo-staging

resources:
  - ../../base

nameSuffix: -staging

commonLabels:
  environment: staging

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: web

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=info
